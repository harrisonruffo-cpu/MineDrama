name: Build & Release Litoral Novelas APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle com Cache Automático
        uses: gradle/actions/setup-gradle@v3

      - name: Criar mock google-services.json se ausente
        run: |
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{
              "project_info": {
                "project_number": "123456789",
                "project_id": "litoral-novelas",
                "storage_bucket": "litoral-novelas.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789:android:abcdef",
                    "android_client_info": {
                      "package_name": "com.aistudio.minidrama.vjklmq"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildPass" }],
                  "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
                }
              ],
              "configuration_version": "1"
            }' > app/google-services.json
          fi

      - name: Compilar APK (:app:assembleDebug)
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Organizar e Renomear APK de Saída
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apk/LitoralNovelas-v1.1.3.apk \;
          echo "APK gerado com sucesso:"
          ls -lh release-apk/

      - name: Publicar APK como Artefato do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: LitoralNovelas-v1.1.3-APK
          path: release-apk/LitoralNovelas-v1.1.3.apk
          retention-days: 30

      - name: Criar GitHub Release Oficial
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/LitoralNovelas-v1.1.3.apk
          name: Litoral Novelas ${{ github.ref_name || 'v1.1.3' }}
          tag_name: ${{ github.ref_name || 'v1.1.3' }}
          body: |
            ## 🌊 Litoral Novelas v1.1.3 - Suporte a Bucket Único de Mídia

            - **Download do APK**: Baixe o arquivo `LitoralNovelas-v1.1.3.apk` abaixo e instale no seu aparelho Android.
            - **Novidades desta versão**:
              - 📦 **Bucket Único de Mídia**: O aplicativo agora unifica o armazenamento de vídeos e capas no mesmo bucket (compatível 100% com o plano gratuito do Appwrite).
              - 🔍 **Detecção Automática do Bucket**: Reconhece automaticamente o bucket criado (seja `videos`, `media`, `covers` ou qualquer outro nome).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
