name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Secrets and Signing Files
        run: |
          # 1. Ensure debug.keystore is present and valid
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

          # 2. Setup .env and .env.example
          cat << 'EOF' > .env.example
          GEMINI_API_KEY=DEFAULT_GEMINI_API_KEY
          GOOGLE_API_KEY=DEFAULT_GOOGLE_API_KEY
          EOF

          cat << 'EOF' > .env
          GEMINI_API_KEY=DEFAULT_GEMINI_API_KEY
          GOOGLE_API_KEY=DEFAULT_GOOGLE_API_KEY
          EOF

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK with Gradle
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
        run: |
          # Generate Gradle wrapper to avoid host/wrapper mismatch
          gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dorg.gradle.configuration-cache=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-drama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
