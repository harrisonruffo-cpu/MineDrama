name: Build & Release Litoral Novelas APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Criar uma Release no GitHub com o APK anexado?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Assinatura Debug e Variáveis de Ambiente
        run: |
          # 1. Recuperar ou gerar debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

          # 2. Configurar arquivos .env
          cat << 'EOF' > .env.example
          GEMINI_API_KEY=DEFAULT_GEMINI_API_KEY
          GOOGLE_API_KEY=DEFAULT_GOOGLE_API_KEY
          EOF

          cat << 'EOF' > .env
          GEMINI_API_KEY=DEFAULT_GEMINI_API_KEY
          GOOGLE_API_KEY=DEFAULT_GOOGLE_API_KEY
          EOF

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Garantir Permissão de Execução no Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew 2>/dev/null || true

      - name: Compilar APK (:app:assembleDebug)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Dksp.use.ksp2=true"
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace -Dorg.gradle.configuration-cache=false -Dksp.use.ksp2=true -Dksp.run.in.process=false
          else
            gradle :app:assembleDebug --stacktrace -Dorg.gradle.configuration-cache=false -Dksp.use.ksp2=true -Dksp.run.in.process=false
          fi

      - name: Organizar e Renomear APK de Saída
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apk/LitoralNovelas-app-debug.apk \;
          echo "APK gerado com sucesso:"
          ls -lh release-apk/

      - name: Salvar APK nos Artifacts do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: LitoralNovelas-APK
          path: release-apk/LitoralNovelas-app-debug.apk
          retention-days: 30

      - name: Criar GitHub Release Oficial
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/LitoralNovelas-app-debug.apk
          name: Litoral Novelas ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## 🌊 Litoral Novelas - APK Oficial para Instalação

            - **Download do APK**: Baixe o arquivo `LitoralNovelas-app-debug.apk` abaixo e instale diretamente no seu aparelho Android.
            - **Recursos**:
              - Streaming vertical de alta performance com reprodução contínua e imersiva.
              - Armazenamento em nuvem com Firebase Cloud Storage e Cloud Firestore para persistência global.
              - Autenticação e sincronização com Contas Google e E-mail.
              - Publicação direta de vídeos MP4 e capas personalizadas.
              - Gerenciamento de histórico de visualização e favoritos salvos na nuvem.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

