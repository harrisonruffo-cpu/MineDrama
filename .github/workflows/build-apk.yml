name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Signing & Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env .env.example
          echo "GOOGLE_API_KEY=" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> .env

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon -Djava.awt.headless=true -Dorg.gradle.configuration-cache=false

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mine-drama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
