name: Build & Release Litoral Novelas APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Garantir Permissão de Execução no Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Criar mock google-services.json se ausente
        run: |
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{
              "project_info": {
                "project_number": "123456789",
                "project_id": "litoral-novelas",
                "storage_bucket": "litoral-novelas.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:123456789:android:abcdef",
                    "android_client_info": {
                      "package_name": "com.aistudio.minidrama.vjklmq"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "AIzaSyDummyKeyForBuildPass" }],
                  "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
                }
              ],
              "configuration_version": "1"
            }' > app/google-services.json
          fi

      - name: Compilar APK (:app:assembleDebug)
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace -Dorg.gradle.configuration-cache=false -Djava.awt.headless=true
          else
            gradle :app:assembleDebug --stacktrace -Dorg.gradle.configuration-cache=false -Djava.awt.headless=true
          fi

      - name: Organizar e Renomear APK de Saída
        run: |
          mkdir -p release-apk
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release-apk/LitoralNovelas-v1.0.9.apk \;
          echo "APK gerado com sucesso:"
          ls -lh release-apk/

      - name: Publicar APK como Artefato do Workflow
        uses: actions/upload-artifact@v4
        with:
          name: LitoralNovelas-v1.0.9-APK
          path: release-apk/LitoralNovelas-v1.0.9.apk
          retention-days: 30

      - name: Criar GitHub Release Oficial
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/LitoralNovelas-v1.0.9.apk
          name: Litoral Novelas ${{ github.ref_name || 'v1.0.9' }}
          tag_name: ${{ github.ref_name || 'v1.0.9' }}
          body: |
            ## 🌊 Litoral Novelas v1.0.9 - Correção de Inicialização e Estabilidade
            
            - **Download do APK**: Baixe o arquivo `LitoralNovelas-v1.0.9.apk` abaixo e instale diretamente no seu aparelho Android.
            - **Melhorias e Correções da Versão 1.0.9**:
              - 🛡️ **Proteção contra Falhas de Inicialização**: Tratamento resiliente do banco Room (migração automática v3), prevenindo conflitos de dados em atualizações de APK.
              - 🛡️ **Player ExoPlayer Blindado**: Inicialização segura com proteção contra exceções e erro de reprodução de vídeo.
              - 🛡️ **Firebase & Appwrite Tolerantes a Falhas**: Tratamento seguro sem interrupção caso a conexão de rede oscile.
              - 🌐 **Endpoint NYC Cloud Ativo**: `https://nyc.cloud.appwrite.io/v1`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
