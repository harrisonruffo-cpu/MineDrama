name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Secrets and Signing Files
        run: |
          # 1. Ensure debug.keystore is present and valid
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

          # 2. Setup .env and .env.example
          cat << 'EOF' > .env.example
          GEMINI_API_KEY=DEFAULT_GEMINI_API_KEY
          GOOGLE_API_KEY=DEFAULT_GOOGLE_API_KEY
          EOF

          cat << 'EOF' > .env
          GEMINI_API_KEY=DEFAULT_GEMINI_API_KEY
          GOOGLE_API_KEY=DEFAULT_GOOGLE_API_KEY
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK with Gradle
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Dksp.use.ksp2=true"
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper || true
          fi
          chmod +x gradlew 2>/dev/null || true
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace -Dorg.gradle.configuration-cache=false -Dksp.use.ksp2=true -Dksp.run.in.process=false
          else
            gradle :app:assembleDebug --stacktrace -Dorg.gradle.configuration-cache=false -Dksp.use.ksp2=true -Dksp.run.in.process=false
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-drama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
