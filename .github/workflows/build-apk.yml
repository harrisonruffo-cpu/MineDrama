name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android Build Environment
        run: |
          # 1. Decode debug keystore if present, or generate a valid one
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Copy debug keystore to root and ~/.android just in case
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

          # 2. Setup environment variables file
          touch .env
          echo "GOOGLE_API_KEY=" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> .env

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\""
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle :app:assembleDebug --stacktrace -Djava.awt.headless=true -Dorg.gradle.configuration-cache=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-drama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
